{% extends "base.html" %}

{% block content %}

<section class="section">
    <div class="container">

        <h1 class="title is-3">My WIL</h1>
        <p class="subtitle is-6">
            주차별로 작성한 WIL을 모아볼 수 있습니다.
        </p>

        {% if wil_list %}

            <div class="box">

                {% for wil in wil_list %}

                    <div class="level">

                        <div class="level-left">
                            <div class="level-item">
                                <strong>{{ wil.week }}주차</strong>
                            </div>
                        </div>

                        <div class="level-right">
                            <div class="level-item">
                                <a
                                    href="{{ wil.url }}"
                                    target="_blank"
                                    class="button is-success is-light"
                                >
                                    WIL 보기
                                </a>
                            </div>
                        </div>

                    </div>

                    {% if not loop.last %}
                        <hr>
                    {% endif %}

                {% endfor %}

            </div>

        {% else %}

            <div class="notification is-light">
                등록된 WIL이 없습니다.
            </div>

        {% endif %}

        <a href="/" class="button is-light">
            홈으로 돌아가기
        </a>

    </div>
</section>

{% endblock %}
