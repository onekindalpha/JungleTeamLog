<!-- 홈 화면 -->
<!-- 로그인 후 사용자가 처음 진입하는 화면 -->
<!-- 주차 선택 (총 1주~23주까지) -->
<section>

    <h2>주차 선택</h2>
    <select id="week-select">
        {% for week in range(1, 24) %}
            <option value="{{ week }}">{{ week }}주차</option>
        {% endfor %}
    </select>

</section>

<!-- My WIL 버튼 -->
<section>
    <button id="my-wil-button">My WIL</button>
</section>

<!-- 로그아웃 버튼 -->
<section>
    <button id="logout-button">로그아웃</button>
</section>

<!-- 홈 화면 JavaScript -->
<script src="{{ url_for('static', filename='js/home.js') }}"></script>

</body>
</html>

<!-- 데이터 흐름 -->
<!--
주차 선택
→ home.js
→ 선택한 week를 Flask의 팀 조회 API에 전달
→ 현재 사용자의 해당 주차 팀 조회
→ 팀 있음: team_page_id로 팀 페이지 이동
→ 팀 없음: 선택한 week를 포함하여 팀 생성 페이지 이동
-->
