{% extends "base.html" %}

{% block content %}

<!-- 홈 화면 -->
<!-- 로그인 후 사용자가 처음 진입하는 화면 -->

<!-- 주차 선택 (총 1주~23주까지) -->
<section>
    <h2>주차 선택</h2>

    <select id="week-select">
        {% for week in range(1, 24) %}
            <option value="{{ week }}">{{ week }}주차</option>
        {% endfor %}
    </select>
</section>

<!-- My WIL 버튼 -->
<section>
    <button id="my-wil-button">My WIL</button>
</section>

<!-- 로그아웃 버튼 -->
<section>
    <button id="logout-button">로그아웃</button>
</section>

{% endblock %}

{% block scripts %}
<script>
    const weekTeams = {{ week_teams | tojson }};
</script>

<script src="{{ url_for('static', filename='js/home.js') }}"></script>
{% endblock %}
