{% extends "base.html" %}

{% block content %}

<section class="home">

    <h1>Jungle TeamLog</h1>

    <p>우리의 23주 흔적</p>

    <div class="week-grid">

        {% for week in range(1, 24) %}

            <!-- 추가: 주차 클릭 시 서버에서 팀 존재 여부 확인 -->
            <a
                href="/team/check/{{ week }}"
                class="week-circle"
            >
                {{ week }}
            </a>

        {% endfor %}

    </div>


    <div class="home-buttons">

        <button id="my-wil-button">My WIL</button>

        <button id="logout-button">로그아웃</button>

    </div>

</section>

{% endblock %}
